packages:
  - "packages/*"
  - "apps/*"
  - "spikes/*"
onlyBuiltDependencies:
  - "@biomejs/biome"
  - better-sqlite3
  - electron
  - esbuild
  # Both download their binary in a postinstall script. Without the allowance
  # pnpm skips it silently and the packages resolve to a path that is not there.
  - "@derhuerst/ffprobe-static"
  - ffmpeg-static
