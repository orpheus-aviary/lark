// N7g-2's native half. One function, and the reason it exists is that nothing
// short of ending the PROCESS actually reopens a library on this app.
//
// `BackHandler.exitApp()` finishes the Activity and leaves the process warm,
// and React Native's JS runtime is application-scoped — so `bootOnce`'s
// `booted` promise and `ports/paths.ts`'s workspace cache both survive it. The
// app would come back holding the library it was told to stop holding, which
// is the one outcome a switch must never produce.

plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.larkapp'
version = '0.1.0'

android {
  // Both spelled out because SDK 57's plugin derives neither: AGP 8 requires
  // the namespace, and expo-autolinking reads `versionName` while configuring
  // every linked project.
  namespace "expo.modules.larkapp"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}
